apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.findByName("release")
                groupId 'kore.botsdk'
                artifactId 'korebotsdklib'
                version '0.3.1'
            }
        }
    }
}
android {
    compileSdk 35

    dataBinding{
        enabled = true
    }

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    dependencies {
        api 'androidx.appcompat:appcompat:1.6.1'
        api 'de.greenrobot:eventbus:2.4.0'
        api 'com.squareup.retrofit2:retrofit:2.9.0'
        api 'com.squareup.okhttp3:logging-interceptor:4.12.0'
        api 'com.google.code.gson:gson:2.10.1'
        api group: 'com.squareup.okhttp3', name: 'okhttp', version: '4.12.0'
        api 'com.squareup.retrofit2:converter-gson:2.9.0'
        api 'io.reactivex.rxjava2:rxandroid:2.1.1'
        api 'com.jakewharton.retrofit:retrofit2-rxjava2-adapter:1.0.0'
        api group: 'org.apache.commons', name: 'commons-lang3', version: '3.3.2'
        api 'com.google.android.gms:play-services-auth:21.2.0'
        
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.robolectric:robolectric:4.16'
        testImplementation 'androidx.test:core:1.7.0'
    }
    namespace 'kore.korebotsdklib'
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}
